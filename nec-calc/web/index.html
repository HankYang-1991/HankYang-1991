<title>NEC Electrical Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first single column (inputs, then results) with a fixed
   bottom module bar; two columns (inputs | results) from 960 px. */
:root {
  --bg: #eef1f3; --surface: #ffffff; --surface-2: #f5f7f8; --ink: #16202a;
  --muted: #5a6672; --line: #d5dce2; --accent: #b4531a; --accent-ink: #ffffff;
  --accent-soft: #f7e8dd; --ok: #1d7a4b; --ok-soft: #e0f2e7; --ng: #c0352b;
  --ng-soft: #fbe4e1; --warn: #8f5d00; --warn-soft: #fbf0d4; --focus: #1f6feb;
  --f-display: "Barlow Condensed", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-body: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans TC", monospace;
  --r: 10px; --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --surface: #172028; --surface-2: #1c2630; --ink: #e4eaef;
    --muted: #94a1ad; --line: #2b3844; --accent: #e78c50; --accent-ink: #1b0f06;
    --accent-soft: #3a2618; --ok: #4cc488; --ok-soft: #153526; --ng: #ff8174;
    --ng-soft: #3d1c19; --warn: #e8b64d; --warn-soft: #382c11; --focus: #73a9ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --surface: #172028; --surface-2: #1c2630; --ink: #e4eaef;
  --muted: #94a1ad; --line: #2b3844; --accent: #e78c50; --accent-ink: #1b0f06;
  --accent-soft: #3a2618; --ok: #4cc488; --ok-soft: #153526; --ng: #ff8174;
  --ng-soft: #3d1c19; --warn: #e8b64d; --warn-soft: #382c11; --focus: #73a9ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font: 15px/1.5 var(--f-body); margin: 0;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px);
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1180px; margin: 0 auto; padding-block: 10px; padding-inline: 16px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 200px; }
.brand b {
  font: 600 26px/1 var(--f-display); letter-spacing: .02em; color: var(--accent);
}
.brand span { font-size: 13px; color: var(--muted); line-height: 1.3; }
@media (max-width: 640px) {
  .brand span { display: none; }
  .brand { flex: 1 1 auto; }
  .top-in { flex-wrap: nowrap; gap: 8px; }
  .seg button { padding: 5px 9px; }
}
.lead { color: var(--muted); font-size: 13px; margin: 0 0 2px; }
@media (min-width: 641px) { .lead { display: none; } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button {
  border: 0; background: transparent; padding: 5px 11px; border-radius: 999px;
  font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; min-height: 32px;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ---------- layout ---------- */
main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 8px; }
.module { display: grid; gap: 14px; }
.module > * { min-width: 0; }
@media (min-width: 960px) {
  .module { grid-template-columns: minmax(0, 430px) minmax(0, 1fr); align-items: start; }
  .module .inputs { position: sticky; top: 76px; max-height: calc(100vh - 160px); overflow: auto; padding-right: 4px; }
}
h2.mod-title { font: 600 24px/1.1 var(--f-display); margin: 2px 0 2px; letter-spacing: .01em; text-wrap: balance; }
.mod-sub { color: var(--muted); font-size: 13px; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.inputs { display: grid; gap: 12px; align-content: start; }
.eyebrow {
  font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  font-weight: 600; margin: 0 0 8px;
}

/* ---------- form ---------- */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld .lbl { font-size: 12.5px; color: var(--muted); line-height: 1.25; }
.fld input:not([type=checkbox]), .fld select {
  width: 100%; min-width: 0; height: 42px; padding: 0 10px; font-size: 16px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2);
  font-variant-numeric: tabular-nums;
}
.fld select { padding-right: 6px; }
.fld.chk { grid-template-columns: auto 1fr; align-items: center; gap: 10px; grid-column: 1 / -1; min-height: 36px; }
.fld.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.fld.chk .lbl { font-size: 14px; color: var(--ink); }
details.more { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 4px; }
details.more > summary {
  cursor: pointer; list-style: none; padding: 8px 0; font-weight: 600; font-size: 14px;
  display: flex; align-items: center; gap: 8px;
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; font: 600 18px/1 var(--f-mono); color: var(--accent); width: 14px; }
details.more[open] > summary::before { content: "−"; }
.note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  min-height: 40px; padding: 0 14px; font-weight: 500; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--ng); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- list items (loads / cables) ---------- */
.list { display: grid; gap: 8px; margin-top: 10px; }
.item {
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface-2);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: start;
}
.item .nm { font-weight: 600; overflow-wrap: anywhere; }
.item .meta { grid-column: 1 / 2; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.item .act { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; }
.item .act button { min-height: 34px; padding: 0 10px; font-size: 13px; }
.item.editing { grid-template-columns: 1fr; background: var(--surface); border-color: var(--accent); }
.tag {
  display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px;
  background: var(--accent-soft); color: var(--ink); margin-right: 4px; white-space: nowrap;
}
.empty { color: var(--muted); font-size: 14px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; text-align: center; }

/* ---------- results ---------- */
.results { display: grid; gap: 12px; align-content: start; }
.results > *, .inputs > * { min-width: 0; }
.res-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.res-head h3 { margin: 0; font: 600 20px/1.1 var(--f-display); letter-spacing: .02em; }
.callout {
  border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line);
  border-left: 4px solid var(--accent); padding: 10px 12px; margin-top: 10px;
}
.wire { font: 500 15px/1.45 var(--f-mono); overflow-wrap: anywhere; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin-top: 10px; }
.key { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.key .k { font-size: 12px; color: var(--muted); line-height: 1.2; }
.key .v { font: 600 24px/1.15 var(--f-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.key .v.txt { font-size: 19px; }
dl.kv.stack { grid-template-columns: minmax(0, 1fr); gap: 2px; }
dl.kv.stack dd { text-align: left; margin-bottom: 6px; }
dl.kv { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 6px 14px; margin: 12px 0 0; font-size: 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; text-align: right; }
.meters { display: grid; gap: 10px; margin-top: 12px; }
.meter .mrow { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.meter .mrow b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); margin-top: 4px; overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--ok); }
.track.warn i { background: var(--warn); }
.track.ng i { background: var(--ng); }
.track s { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55; }
details.steps { margin-top: 12px; border-top: 1px solid var(--line); }
details.steps > summary { cursor: pointer; padding: 10px 0 4px; font-weight: 600; font-size: 14px; }
ol.steplist { margin: 4px 0 0; padding: 0; list-style: none; counter-reset: st; display: grid; gap: 8px; }
ol.steplist li {
  counter-increment: st; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 8px;
  font-size: 14px; line-height: 1.45;
}
ol.steplist li::before {
  content: counter(st); font: 500 12px/1.9 var(--f-mono); color: var(--muted); text-align: right;
}
ol.steplist li .tx { overflow-wrap: anywhere; }
ol.steplist li .rf { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font: 500 11.5px/1.6 var(--f-mono); padding: 0 7px; border-radius: 5px;
  border: 1px solid var(--line); color: var(--muted); background: var(--surface-2); overflow-wrap: anywhere;
}
.chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.chip.ng { color: var(--ng); background: var(--ng-soft); border-color: transparent; }
.warns { margin-top: 12px; display: grid; gap: 6px; }
.warns p { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); font-size: 13.5px; border-left: 3px solid var(--warn); }
.err { padding: 12px; border-radius: 8px; background: var(--ng-soft); border-left: 4px solid var(--ng); }
.sub { margin-top: 14px; padding-top: 12px; border-top: 2px solid var(--line); }
.sub > h4 { margin: 0 0 4px; font: 600 18px/1.2 var(--f-display); letter-spacing: .02em; }
.toast { font-size: 12.5px; color: var(--ok); min-height: 1em; }
.tbl-wrap { overflow-x: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; }
table.cap { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
table.cap th, table.cap td { padding: 6px 9px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.cap th:first-child, table.cap td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
table.cap thead th { background: var(--surface-2); font-weight: 600; }
.phasebars { display: grid; gap: 6px; margin-top: 12px; }
.pb { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.pb .bar { height: 10px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.pb .bar i { display: block; height: 100%; background: var(--accent); }
.disc { color: var(--muted); font-size: 12px; margin: 18px 0 0; max-width: 70ch; }
.example { font-size: 12px; color: var(--warn); margin: 6px 0 0; }

/* ---------- bottom module bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); }
.tabbar button {
  border: 0; background: transparent; height: var(--nav-h); display: grid; place-items: center;
  align-content: center; gap: 2px; font-size: 12px; color: var(--muted); cursor: pointer; position: relative;
  padding: 0 2px;
}
.tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tabbar button[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent);
}
.tabbar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-size: 11.5px; }
table.cap td.ng { color: var(--ng); font-weight: 600; }
table.cap td.okc { color: var(--ok); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) {
  .track i, .pb .bar i { transition: width .25s ease; }
}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>NEC</b><span id="subtitle"></span></div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button>

    </div>
  </div>
</header>

        h = loadResultCard(r);
        var txt = [r.panel.name + " (" + r.panel.system + ")"].concat(N.loadSummaryRows(r.calc, S.lang).map(function (x) { return x[0] + ": " + x[1]; }))
          .concat(N.loadNotes(r.calc, S.lang));
        if (r.feeder) txt = txt.concat(["", t("size_feeder"), plainText("lc", r.feeder)]);
        lastText[id] = txt.join("\n");
      } else {
        h = resultCard(id, r);
        lastText[id] = plainText(id, r);
      }
      if (id === "tr" && S.tr.show_cap) h += capacityCard();
    } catch (e) {
      if (!(e instanceof N.CalcError)) { console.error(e); h = '<div class="err">' + esc(t("error") + ": " + e.message) + "</div>"; }
      else h = '<section class="card"><div class="err">' + esc(t("error") + ": " + N.tr(e.key, S.lang, e.params)) + "</div></section>";
      if (id === "tr" && S.tr.show_cap) h += capacityCard();
      lastText[id] = "";
    }
    box.innerHTML = h + '<p class="disc">' + esc(t("disclaimer")) + "</p>";
  }

  // ------------------------------------------------------------------ render
  function render() {
    document.documentElement.lang = S.lang === "zh" ? "zh-Hant" : "en";
    document.getElementById("subtitle").textContent = t("web_subtitle");
    document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.lang === S.lang ? "true" : "false"); });
    document.querySelectorAll("[data-ed]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.ed === S.ed ? "true" : "false"); });
    document.getElementById("tabbar").innerHTML = MODULES.map(function (m) {
      return '<button type="button" data-tab="' + m.id + '"' + (m.id === S.tab ? ' aria-current="page"' : "") +
        '><svg viewBox="0 0 24 24" aria-hidden="true">' + m.icon + "</svg><span>" + esc(t(m.nav)) + "</span></button>";
    }).join("");
    var mod = MODULES.filter(function (m) { return m.id === S.tab; })[0] || MODULES[0];
    var app = document.getElementById("app");
    app.innerHTML = '<div class="module"><div class="inputs"><div><p class="lead">' + esc(t("web_subtitle")) + '</p><h2 class="mod-title">' + esc(t(mod.title)) +
      '</h2><p class="mod-sub">' + esc(t("auto_calc_note")) + "</p></div>" + FORMS[mod.id]() +
      '</div><div class="results" id="results" aria-live="polite"></div></div>';
    renderResults();
  }
  function rerenderForm() {
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }

  var timer = null;
  function schedule() { clearTimeout(timer); timer = setTimeout(renderResults, 140); }

  // ------------------------------------------------------------------ events
  document.querySelector(".top").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.lang) { S.lang = b.dataset.lang; save(); rerenderForm(); }
    if (b.dataset.ed) { S.ed = b.dataset.ed; save(); render(); }
  });
  document.getElementById("tabbar").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]");
    if (!b) return;
    S.tab = b.dataset.tab; save(); render(); window.scrollTo(0, 0);
  });
  function onField(e) {
    var el = e.target, path = el.dataset && el.dataset.path;
    if (!path) return;
    var type = el.dataset.type, v;
    if (type === "chk") v = el.checked;
    else if (type === "selnum") v = Number(el.value);
    else v = el.value;
    setPath(path, v);
    if (path.indexOf("@draft") === 0) {
      if (path === "@draft.sc.kind" || path === "@draft.sc.material") {
        var dr = UI.draft.sc, rl = N.buswayRatings(dr.material, "bw_plugin");
        if (rl.indexOf(Number(dr.rating)) < 0) dr.rating = rl[rl.length - 1];
        if (dr.material === "al" && dr.size === "14") dr.size = "12";
        rerenderForm();
      }
      if (path === "@draft.tr.kind") {
        var sizes = trSizes(v);
        if (sizes.indexOf(UI.draft.tr.size) < 0) UI.draft.tr.size = sizes[Math.floor(sizes.length / 2)];
        UI.draft.tr.n_cond = (v === "lv_single" || v === "mv_single") ? 1 : 3;
        rerenderForm();
      }
      return;
    }
    if (path === "br.type") {
      var CONT = { lighting: 100, heating: 100, receptacle: 0, equipment: 0, other: 0 };
      S.br.cont = String(CONT[v] || 0);
      var c = document.getElementById("f-br-cont");
      if (c) c.value = S.br.cont;
    }
    save();
    if (/\.method$/.test(path)) { rerenderForm(); return; }
    if (path.indexOf("lc.") === 0 && S.tab === "lc" && e.type === "change" && /^lc\.(system|div|tpf)$/.test(path)) { rerenderForm(); return; }
    schedule();
  }
  var app = document.getElementById("app");
  app.addEventListener("input", onField);
  app.addEventListener("change", function (e) { if (e.target.tagName === "SELECT" || e.target.type === "checkbox") onField(e); });
  app.addEventListener("toggle", function (e) {
    var d = e.target;
    if (d.dataset && d.dataset.steps) UI.stepsOpen[d.dataset.steps] = d.open;
  }, true);
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]");
    if (!b) return;
    var act = b.dataset.act, i = b.dataset.i !== undefined ? parseInt(b.dataset.i, 10) : null;
    var listKey = act.slice(0, 2), kind = act.slice(3);
    ["lc", "tr", "sc", "hm"].forEach(function (k) { if (act !== k + "-clear") UI.clearArm[k] = false; });
    if (act === "copy") { copyResults(); return; }
    if (act === "tr-cap") { S.tr.show_cap = !S.tr.show_cap; save(); rerenderForm(); return; }
    var listName = { lc: "loads", tr: "cables", sc: "segs", hm: "drives" }[listKey];
    var maker = { lc: N.loadItem, tr: N.trayCable, sc: N.scSegment, hm: N.harmDrive }[listKey];
    var examples = { lc: EXAMPLE_LOADS, tr: EXAMPLE_CABLES, sc: EXAMPLE_SEGS, hm: EXAMPLE_DRIVES }[listKey];
    if (!listName) return;
    if (kind === "new") {
      UI.edit[listKey] = "new";
      UI.draft[listKey] = draftOf(listKey, maker({ name: { lc: "Load", tr: "Cable", sc: "PNL", hm: "VFD" }[listKey],
        kind: listKey === "sc" ? "cable" : (listKey === "tr" ? "lv_multi" : undefined) }));
    }
    else if (kind === "edit") { UI.edit[listKey] = i; UI.draft[listKey] = draftOf(listKey, S[listKey][listName][i]); }
    else if (kind === "cancel") { UI.edit[listKey] = null; UI.draft[listKey] = null; }
    else if (kind === "del") { S[listKey][listName].splice(i, 1); S[listKey].example = false; UI.edit[listKey] = null; }
    else if (kind === "save") {
      var item;
      try { item = fromDraft(listKey, UI.draft[listKey]); }
      catch (err) {
        if (err instanceof N.CalcError) { alertInline(b, N.tr(err.key, S.lang, err.params)); return; }
        throw err;
      }
      if (UI.edit[listKey] === "new") S[listKey][listName].push(item); else S[listKey][listName][UI.edit[listKey]] = item;
      S[listKey].example = false; UI.edit[listKey] = null; UI.draft[listKey] = null;
    } else if (kind === "example") {
      S[listKey][listName] = examples.map(function (x) { return maker(x); });
      S[listKey].example = true; UI.edit[listKey] = null;
    } else if (kind === "clear") {
      if (!UI.clearArm[listKey]) { UI.clearArm[listKey] = true; rerenderForm(); return; }
      UI.clearArm[listKey] = false; S[listKey][listName] = []; S[listKey].example = false; UI.edit[listKey] = null;
    }
    save(); rerenderForm();
  });
  function draftOf(listKey, item) {
    var d = Object.assign({}, item);
    if (listKey === "lc") {
      d.qty = String(d.qty); d.rating = String(d.rating); d.pf = String(d.pf); d.voltage = String(d.voltage);
      d.demand_factor = d.demand_factor === null || d.demand_factor === undefined ? "" : String(d.demand_factor);
    } else if (listKey === "tr") { d.qty = String(d.qty); d.od_in = String(d.od_in || 0); }
    else if (listKey === "sc") ["kva", "z_pct", "xr", "sec_v", "length_ft", "sets", "aic_ka", "motor_a"].forEach(function (k) { d[k] = String(d[k]); });
    else if (listKey === "hm") ["qty", "hp", "load_pct", "input_a", "thd_pct"].forEach(function (k) { d[k] = String(d[k]); });
    return d;
  }
  function fromDraft(listKey, d) {
    if (listKey === "sc") return N.scSegment({ name: d.name || "PNL", kind: d.kind, kva: num(d.kva, "kva"),
      z_pct: num(d.z_pct, "z_pct"), xr: num(d.xr, "xr"), sec_v: num(d.sec_v, "sec_v"), length_ft: num(d.length_ft, "length"),
      size: d.size, sets: Math.max(Math.trunc(num(d.sets, "sets")), 1), material: d.material, conduit: d.conduit,
      rating: Number(d.rating), device: d.device, aic_ka: num(d.aic_ka || "0", "aic_sel"), motor_a: num(d.motor_a || "0", "motor_load") });
    if (listKey === "hm") return N.harmDrive({ name: d.name || "VFD", drive_type: d.drive_type,
      qty: Math.max(Math.trunc(num(d.qty, "col_qty")), 0), hp: num(d.hp, "hp"), load_pct: num(d.load_pct, "load_pct"),
      input_a: num(d.input_a || "0", "input_a"), thd_pct: num(d.thd_pct || "0", "thd_pct") });
    if (listKey === "lc") return N.loadItem({ name: d.name || "Load", category: d.category, qty: Math.max(Math.trunc(num(d.qty, "col_qty")), 0),
      rating: num(d.rating, "col_rating"), unit: d.unit, pf: num(d.pf, "pf"), voltage: num(d.voltage, "col_v"),
      phases: Number(d.phases), continuous: !!d.continuous, demand_factor: num(d.demand_factor, "df_auto", true),
      phase_conn: d.phase_conn || "auto" });
    var c = N.trayCable({ name: d.name || "Cable", kind: d.kind, size: d.size, n_cond: Number(d.n_cond),
      qty: Math.max(Math.trunc(num(d.qty, "cable_qty")), 0), od_in: num(d.od_in || "0", "cable_od_in"),
      material: d.material, ins_level: d.ins_level });
    N.cableOd(c);
    return c;
  }
  function alertInline(btn, msg) {
    var p = btn.parentNode.querySelector(".err");
    if (!p) { p = document.createElement("div"); p.className = "err"; p.style.flexBasis = "100%"; btn.parentNode.appendChild(p); }
    p.textContent = t("error") + ": " + msg;
  }
  function copyResults() {
    var text = lastText[S.tab] || "", toast = document.getElementById("toast-" + S.tab);
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "width:100%;min-height:160px;margin-top:8px;font:13px/1.4 var(--f-mono)";
      var card = document.querySelector("#results .card");
      if (card && !card.querySelector("textarea")) card.appendChild(ta);
      ta.focus(); ta.select();
      if (toast) toast.textContent = t("copy_failed");
    }
    try {
      navigator.clipboard.writeText(text).then(function () { if (toast) toast.textContent = t("copied"); }, fallback);
    } catch (e) { fallback(); }
  }

  render();
})();
</script>
